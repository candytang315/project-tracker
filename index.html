<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>專案週報</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f3; padding: 1.5rem; color: #1a1a1a; }
.wrap { max-width: 1280px; margin: 0 auto; }
.layout { display: grid; grid-template-columns: 220px minmax(0,1fr) 280px; gap: 1.5rem; align-items: start; }
.nav-col { background: #fff; border: 1px solid #e5e5e3; border-radius: 12px; padding: 0.75rem; }
.nav-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 6px; color: #666; font-size: 14px; cursor: pointer; margin-bottom: 4px; white-space: normal; word-break: break-word; }
.nav-item:hover { background: #f5f5f3; }
.nav-item.active { background: #E6F1FB; color: #185FA5; font-weight: 500; }
.nav-item .nav-count { margin-left: auto; font-size: 12px; color: #aaa; }
.nav-item.active .nav-count { color: #185FA5; }
.tab-section { display: none; }
.tab-section.active { display: block; }
.left-col { min-width: 0; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } .nav-col { display: flex; gap: 8px; overflow-x: auto; } .nav-item { white-space: nowrap; margin-bottom: 0; } }
.page-title { font-size: 19px; font-weight: 500; margin-bottom: 4px; }
.week-label { font-size: 14px; color: #666; margin-bottom: 1.5rem; }
.sec-title { font-size: 14px; font-weight: 500; color: #555; margin-bottom: 10px; }
.done-sec-title { font-size: 14px; font-weight: 500; color: #999; margin: 1.2rem 0 8px; }
.project-card { background: #fff; border: 1px solid #e5e5e3; border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
.project-card.is-done { opacity: 0.65; }
.card-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; gap: 8px; }
.card-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.card-left-text { min-width: 0; flex: 1; }
.project-name { font-size: 15px; font-weight: 500; }
.project-name.done-text { text-decoration: line-through; color: #aaa; }
.project-meta { font-size: 13px; color: #888; margin-top: 2px; }
.badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
.badge-high { background: #FCEBEB; color: #A32D2D; }
.badge-mid  { background: #FAEEDA; color: #854F0B; }
.badge-low  { background: #EAF3DE; color: #3B6D11; }
.badge-done { background: #E1F5EE; color: #0F6E56; }
.card-actions { display: flex; gap: 4px; flex-shrink: 0; align-items: center; }
.btn-icon { background: none; border: none; cursor: pointer; padding: 5px 6px; border-radius: 6px; color: #888; font-size: 19px; display: inline-flex; align-items: center; }
.btn-icon:hover { background: #f0f0ee; color: #333; }
.btn-icon.del:hover  { color: #A32D2D; background: #FCEBEB; }
.btn-icon.undo:hover { color: #854F0B; background: #FAEEDA; }
.btn-icon.ok:hover   { color: #0F6E56; background: #E1F5EE; }
.btn-icon.cal:hover  { color: #378ADD; background: #E6F1FB; }
.btn-complete { font-size: 13px; padding: 5px 12px; border-radius: 6px; border: 1px solid #9FE1CB; background: #E1F5EE; color: #0F6E56; cursor: pointer; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.btn-complete:hover { background: #9FE1CB; }
.card-edit { padding: 0 14px 14px; border-top: 1px solid #eee; }
.edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-top: 12px; }
.edit-grid .full { grid-column: 1 / -1; }
.edit-label { font-size: 12px; color: #999; display: block; margin-bottom: 3px; }
select, input[type="text"], input[type="date"] { font-size: 14px; padding: 5px 9px; border-radius: 6px; border: 1px solid #ddd; background: #fafafa; color: #1a1a1a; width: 100%; }
.logs-area { border-top: 1px solid #eee; padding: 10px 14px 14px; background: #fafafa; }
.logs-label { font-size: 12px; color: #999; margin-bottom: 8px; }
.log-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; }
.log-date { font-size: 13px; color: #999; white-space: nowrap; padding-top: 3px; width: 40px; flex-shrink: 0; }
.log-text { font-size: 14px; color: #333; line-height: 1.5; flex: 1; word-break: break-word; white-space: pre-wrap; }
.log-del { background: none; border: none; cursor: pointer; color: #ccc; font-size: 17px; padding: 1px 3px; flex-shrink: 0; }
.log-del:hover { color: #A32D2D; }
.add-log { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.add-log-row { display: flex; gap: 6px; align-items: center; }
.add-log-row textarea { flex: 1; resize: vertical; font-family: inherit; line-height: 1.5; font-size: 14px; padding: 5px 9px; border-radius: 6px; border: 1px solid #ddd; background: #fafafa; color: #1a1a1a; }
.btn-sm { font-size: 13px; padding: 5px 14px; border-radius: 6px; border: 1px solid #ddd; background: #fff; color: #333; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.btn-sm:hover { background: #f0f0ee; }
.add-card { border: 1px dashed #ccc; border-radius: 12px; padding: 14px; margin-bottom: 10px; background: #fff; }
.add-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.add-grid .full { grid-column: 1 / -1; text-align: right; }
.divider { border: none; border-top: 1px solid #e5e5e3; margin: 1.5rem 0; }
.btn-export { font-size: 14px; padding: 8px 18px; border-radius: 6px; border: 1px solid #ddd; background: #fff; color: #333; cursor: pointer; }
.btn-export:hover { background: #f0f0ee; }
.copied { font-size: 13px; color: #0F6E56; margin-left: 10px; display: none; }
.export-box { margin-top: 1rem; background: #fafafa; border: 1px solid #e5e5e3; border-radius: 8px; padding: 1rem; font-size: 14px; white-space: pre-wrap; line-height: 1.7; display: none; }
.sync-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 1.2rem; padding: 10px 14px; background: #fff; border: 1px solid #e5e5e3; border-radius: 10px; font-size: 13px; color: #888; }
.sync-bar .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
.sync-bar .status-dot.ok { background: #3B6D11; }
.sync-bar .status-dot.err { background: #A32D2D; }
.sync-bar .status-dot.busy { background: #854F0B; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
.sync-bar .spacer { flex: 1; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal-box { background: #fff; border-radius: 12px; padding: 1.5rem; max-width: 360px; width: 90%; }
.modal-box h3 { font-size: 16px; margin-bottom: 10px; }
.modal-box p { font-size: 14px; color: #666; margin-bottom: 12px; line-height: 1.6; }
.modal-box input { margin-bottom: 10px; }

.cal-card { background: #fff; border: 1px solid #e5e5e3; border-radius: 12px; padding: 1rem; margin-bottom: 10px; }
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-header button { background: none; border: none; cursor: pointer; font-size: 17px; color: #888; padding: 2px 6px; }
.cal-header button:hover { color: #333; }
.cal-title { font-weight: 500; font-size: 15px; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; font-size: 13px; text-align: center; }
.cal-grid .dow { font-size: 12px; color: #999; padding-bottom: 4px; }
.cal-day { padding: 6px 0; border-radius: 6px; position: relative; cursor: default; }
.cal-day.has-event { cursor: pointer; }
.cal-day.has-event:hover { background: #f0f0ee; }
.cal-day.selected { background: #E6F1FB; }
.cal-day.other-month { color: #ccc; }
.cal-day.today { border: 1.5px solid #378ADD; font-weight: 500; }
.cal-dot { width: 5px; height: 5px; border-radius: 50%; margin: 2px auto 0; }
.cal-legend { margin-top: 12px; padding-top: 10px; border-top: 1px solid #eee; font-size: 12px; color: #888; line-height: 1.8; }
.cal-legend .leg-row { display: flex; align-items: center; gap: 6px; }
.cal-legend .leg-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.today-card-title { font-weight: 500; font-size: 14px; margin-bottom: 10px; }
.today-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0f0ee; }
.today-item:last-child { border-bottom: none; }
.today-item .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.today-item .ti-name { font-size: 14px; margin: 0; font-weight: 500; }
.today-item .ti-sub { font-size: 13px; color: #888; margin: 2px 0 0; }
.today-empty { font-size: 14px; color: #bbb; }

.reminders-area { border-top: 1px solid #eee; padding: 10px 14px 14px; background: #fafafa; }
.reminders-label { font-size: 12px; color: #999; margin-bottom: 8px; }
.rem-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
.rem-row:last-of-type { border-bottom: none; }
.rem-date { font-size: 13px; color: #378ADD; font-weight: 500; white-space: nowrap; width: 42px; padding-top: 2px; }
.rem-text { font-size: 14px; flex: 1; line-height: 1.5; word-break: break-word; }
.rem-icon { background: none; border: none; cursor: pointer; color: #bbb; font-size: 16px; padding: 2px 3px; flex-shrink: 0; }
.rem-icon:hover { color: #555; }
.rem-icon.del:hover { color: #A32D2D; }
.rem-icon.cal:hover { color: #378ADD; }
.add-rem { display: flex; gap: 6px; margin-top: 10px; align-items: center; }
.add-rem input[type="date"] { width: 120px; flex-shrink: 0; }
.add-rem input[type="text"] { flex: 1; }

.nav-sub-wrap { margin: 4px 0 8px 8px; padding-left: 10px; border-left: 2px solid #E6F1FB; display: none; }
.nav-sub-wrap.open { display: block; }
.nav-item .nav-chevron { font-size: 16px; color: #bbb; transition: transform 0.15s; margin-left: 4px; cursor: pointer; padding: 0 4px; display: inline-block; }
.nav-item.open .nav-chevron { transform: rotate(90deg); }
.nav-sub-item { padding: 6px 10px; border-radius: 6px; font-size: 13px; color: #888; margin-bottom: 2px; display: flex; align-items: flex-start; gap: 6px; cursor: pointer; white-space: normal; word-break: break-word; }
.nav-sub-item:hover { background: #f5f5f3; color: #333; }
.nav-sub-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.card-highlight { animation: cardFlash 1.4s ease; }
@keyframes cardFlash { 0%,100% { box-shadow: none; } 30% { box-shadow: 0 0 0 3px #B7D8F2; } }

.history-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
.history-item .h-time { color: #555; }
.history-item .h-restore { font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid #ddd; background: #fff; cursor: pointer; }
.history-item .h-restore:hover { background: #f0f0ee; }
.history-loading { font-size: 13px; color: #999; padding: 12px 0; text-align: center; }

/* ===== 手機版 RWD ===== */
@media (max-width: 768px) {
  body { padding: 0.75rem; }

  /* 三欄改成單欄 */
  .layout { grid-template-columns: 1fr; gap: 0.75rem; }

  /* 左側導覽改成橫向 tab 列 */
  .nav-col { display: flex; flex-direction: row; gap: 6px; overflow-x: auto; padding: 0.5rem; }
  .nav-item { white-space: nowrap; padding: 8px 12px; font-size: 13px; flex-shrink: 0; margin-bottom: 0; }
  .nav-item .nav-chevron { display: none; }
  .nav-sub-wrap { display: none !important; }

  /* 右側月曆隱藏（手機螢幕太窄） */
  .right-col { display: none; }

  /* 卡片 header 改為上下排列 */
  .card-header { flex-direction: column; align-items: flex-start; gap: 8px; }
  .card-left { width: 100%; }
  .card-actions { width: 100%; display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 4px; }

  /* 編輯區 grid 改單欄 */
  .edit-grid { grid-template-columns: 1fr; }
  .edit-grid .full { grid-column: 1; }

  /* 新增表單 grid 改單欄 */
  .add-grid { grid-template-columns: 1fr; }
  .add-grid .full { grid-column: 1; text-align: left; }

  /* sync-bar 簡化 */
  .sync-bar { flex-wrap: wrap; gap: 6px; font-size: 13px; }

  /* 週報標題 */
  .page-title { font-size: 16px; }
  .week-label { font-size: 12px; }

  /* 待辦事項輸入列 */
  .add-rem { flex-direction: column; }
  .add-rem input[type="date"] { width: 100%; }

  /* 進度記錄輸入列 */
  .add-log { gap: 6px; }
}

.cal-day.weekend { color: #C0392B; }
.cal-day.holiday { background: #FEF0F0; color: #C0392B; font-weight: 500; }
.cal-day.holiday.today { border-color: #C0392B; }
.cal-holiday-dot { width: 5px; height: 5px; border-radius: 50%; background: #E74C3C; margin: 1px auto 0; }

.brand-row { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.brand-btn { font-size: 12px; padding: 4px 10px; border-radius: var(--border-radius-md); border: 0.5px solid #ddd; background: #fff; color: #555; cursor: pointer; font-weight: 500; }
.brand-btn:hover { background: #f0f0ee; }
.brand-btn.selected { background: #E6F1FB; border-color: #378ADD; color: #185FA5; }

.rem-checkbox { width: 16px; height: 16px; margin-top: 2px; cursor: pointer; flex-shrink: 0; accent-color: #378ADD; }
.rem-text.rem-done { text-decoration: line-through; color: #bbb; }
</style>
</head>
<body>

<div id="token-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h3>🔑 設定 GitHub Token</h3>
    <p>請輸入你的 GitHub Personal Access Token，用來讀寫資料。只會存在這台裝置的瀏覽器裡。</p>
    <input type="text" id="token-input" placeholder="ghp_xxxxxxxxxxxxxxxx" />
    <button class="btn-sm" onclick="saveToken()" style="width:100%;">儲存並開始使用</button>
  </div>
</div>

<div class="wrap">
  <h1 class="page-title" style="font-family:'Pacifico',cursive; font-size:28px; font-weight:400; letter-spacing:1px;">Calendar</h1>
  <p class="week-label" id="week-range"></p>

<div class="layout">

<div class="nav-col">
  <div class="nav-item active" data-tab="tab-project" id="nav-item-project" onclick="switchTab('tab-project')">
    📁 進行中的專案
    <span class="nav-count" id="nav-count-project">0</span>
    <span class="nav-chevron" onclick="event.stopPropagation();toggleNavGroup('project')">›</span>
  </div>
  <div class="nav-sub-wrap" id="nav-sub-project"></div>

  <div class="nav-item" data-tab="tab-repair" id="nav-item-repair" onclick="switchTab('tab-repair')">
    🔧 維修及零星工程
    <span class="nav-count" id="nav-count-repair">0</span>
    <span class="nav-chevron" onclick="event.stopPropagation();toggleNavGroup('repair')">›</span>
  </div>
  <div class="nav-sub-wrap" id="nav-sub-repair"></div>

  <div class="nav-item" data-tab="tab-done" id="nav-item-done" onclick="switchTab('tab-done')">
    ✅ 已完成
    <span class="nav-count" id="nav-count-done">0</span>
    <span class="nav-chevron" onclick="event.stopPropagation();toggleNavGroup('done')">›</span>
  </div>
  <div class="nav-sub-wrap" id="nav-sub-done"></div>
</div>

<div class="left-col">

  <div class="sync-bar">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">準備中…</span>
    <span class="spacer"></span>
    <button class="btn-sm" onclick="manualSync()">🔄 同步</button>
    <button class="btn-sm" onclick="showHistoryModal()">↩ 還原</button>
    <button class="btn-sm" onclick="showTokenModal()">⚙️</button>
  </div>

  <div id="history-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="max-width:420px;">
      <h3>↩ 還原歷史版本</h3>
      <p>選擇一個時間點，會把資料還原成當時的內容（目前內容會被覆蓋）。</p>
      <div id="history-list" style="max-height:280px;overflow-y:auto;margin-bottom:12px;"></div>
      <button class="btn-sm" onclick="hideHistoryModal()" style="width:100%;">取消</button>
    </div>
  </div>

  <div class="tab-section active" id="tab-project">
    <div class="sec-title">進行中的專案</div>
    <div id="active-list"></div>
    <div class="add-card">
      <div class="sec-title" style="margin-bottom:10px;">新增專案</div>
      <div class="add-grid">
        <div class="full">
        <label class="edit-label">品牌（選填，選了會自動加在名稱前）</label>
        <div class="brand-row" id="brand-row-project">
          <button type="button" class="brand-btn" onclick="selectBrand('project','LOC')">LOC</button>
          <button type="button" class="brand-btn" onclick="selectBrand('project','ELE')">ELE</button>
          <button type="button" class="brand-btn selected" onclick="selectBrand('project','')">不選（自填）</button>
        </div>
      </div>
      <div><label class="edit-label">專案名稱</label><input type="text" id="an" placeholder="例：漢神洲際" /></div>
        <div><label class="edit-label">指派日期</label><input type="date" id="aa" /></div>
        <div><label class="edit-label">專案說明／備註</label><textarea id="at" placeholder="例：局部修改後送百貨圖審" rows="2" style="resize:vertical;font-family:inherit;line-height:1.5;font-size:14px;padding:5px 9px;border-radius:6px;border:1px solid #ddd;background:#fafafa;color:#1a1a1a;width:100%;"></textarea></div>
        <div><label class="edit-label">預計完成日期</label><input type="date" id="ad" /></div>
        <div><label class="edit-label">優先順序</label>
          <select id="ap"><option value="high">🔴 高</option><option value="mid" selected>🟡 中</option><option value="low">🟢 低</option></select>
        </div>
        <div class="full"><button class="btn-sm" onclick="addItem('project')">＋ 新增</button></div>
      </div>
    </div>
  </div>

  <div class="tab-section" id="tab-repair">
    <div class="sec-title">維修及零星工程</div>
    <div id="repair-active-list"></div>
    <div class="add-card">
      <div class="sec-title" style="margin-bottom:10px;">新增維修及零星工程</div>
      <div class="add-grid">
        <div class="full">
        <label class="edit-label">品牌（選填，選了會自動加在名稱前）</label>
        <div class="brand-row" id="brand-row-repair">
          <button type="button" class="brand-btn" onclick="selectBrand('repair','LOC')">LOC</button>
          <button type="button" class="brand-btn" onclick="selectBrand('repair','ELE')">ELE</button>
          <button type="button" class="brand-btn selected" onclick="selectBrand('repair','')">不選（自填）</button>
        </div>
      </div>
      <div><label class="edit-label">工程名稱</label><input type="text" id="rn" placeholder="例：漢神洲際燈具維修" /></div>
        <div><label class="edit-label">指派日期</label><input type="date" id="ra" /></div>
        <div><label class="edit-label">工程內容／備註</label><textarea id="rt" placeholder="例：燈具損壞需更換" rows="2" style="resize:vertical;font-family:inherit;line-height:1.5;font-size:14px;padding:5px 9px;border-radius:6px;border:1px solid #ddd;background:#fafafa;color:#1a1a1a;width:100%;"></textarea></div>
        <div><label class="edit-label">預計完成日期</label><input type="date" id="rd" /></div>
        <div><label class="edit-label">優先順序</label>
          <select id="rp"><option value="high">🔴 高</option><option value="mid" selected>🟡 中</option><option value="low">🟢 低</option></select>
        </div>
        <div class="full"><button class="btn-sm" onclick="addItem('repair')">＋ 新增</button></div>
      </div>
    </div>
  </div>

  <div class="tab-section" id="tab-done">
    <div class="sec-title">已完成的專案</div>
    <div id="done-list"></div>
    <div class="sec-title" style="margin-top:1.2rem;">已完成的維修及零星工程</div>
    <div id="repair-done-list"></div>
  </div>

  <hr class="divider">
  <button class="btn-export" onclick="exportReport()">複製週報給 Claude 整理</button>
  <span class="copied" id="copied">已複製 ✓</span>
  <div class="export-box" id="export-box"></div>

</div>

<div class="right-col">
  <div class="cal-card">
    <div class="cal-header">
      <button onclick="calPrevMonth()">‹</button>
      <span class="cal-title" id="cal-title"></span>
      <button onclick="calNextMonth()">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
  <div class="cal-card">
    <p class="today-card-title" id="today-title"></p>
    <div id="today-list"></div>
  </div>
</div>

</div>
</div>

<script>

const TW_HOLIDAYS_2026 = {
  '2026-01-01': '元旦',
  '2026-02-15': '小年夜',
  '2026-02-16': '除夕',
  '2026-02-17': '春節初一',
  '2026-02-18': '春節初二',
  '2026-02-19': '春節初三',

};

const GH_OWNER='candytang315';
const GH_REPO='project-tracker';
const GH_PATH='data.json';
const GH_API=`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`;

let projects=[];
let repairs=[];
let nextId=1;
let fileSha=null;
let saveTimer=null;

function getToken(){ return localStorage.getItem('gh_token')||''; }

function showTokenModal(){ document.getElementById('token-modal').style.display='flex'; }
function hideTokenModal(){ document.getElementById('token-modal').style.display='none'; }

function saveToken(){
  const t=document.getElementById('token-input').value.trim();
  if(!t) return;
  localStorage.setItem('gh_token', t);
  hideTokenModal();
  loadFromGitHub();
}

function setStatus(state, text){
  const dot=document.getElementById('status-dot');
  dot.className='status-dot '+(state||'');
  document.getElementById('status-text').textContent=text;
}

function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

function getWeekRange(){
  const now=new Date(), day=now.getDay();
  const mon=new Date(now); mon.setDate(now.getDate()-(day===0?6:day-1));
  const fri=new Date(mon); fri.setDate(mon.getDate()+4);
  const fmt=d=>`${d.getMonth()+1}/${d.getDate()}`;
  const wn=Math.ceil((((now-new Date(now.getFullYear(),0,1))/86400000)+new Date(now.getFullYear(),0,1).getDay()+1)/7);
  document.getElementById('week-range').textContent=`${now.getFullYear()} 第${wn}週｜${fmt(mon)} – ${fmt(fri)}`;
}

function badgeHtml(p){
  if(p.done)return`<span class="badge badge-done">✅ 完成</span>`;
  const m={high:['badge-high','🔴 高'],mid:['badge-mid','🟡 中'],low:['badge-low','🟢 低']};
  const[c,l]=m[p.priority]||m.mid;return`<span class="badge ${c}">${l}</span>`;
}

function fmtDate(s){if(!s)return'';const[,m,d]=s.split('-');return`${parseInt(m)}/${parseInt(d)}`;}

function cardHtml(p){
  const sortedLogs = (p.logs||[])
    .map((l,originalIndex)=>({...l,originalIndex}))
    .sort((a,b)=>{
      if(!a.date && !b.date) return 0;
      if(!a.date) return 1;
      if(!b.date) return -1;
      return a.date.localeCompare(b.date);
    });

  const logsHtml=sortedLogs.length
    ?sortedLogs.map((l)=>{
    const li=l.originalIndex;
      if(l.editing){
        return `
      <div class="log-row" style="background:#f0f4ff;padding:6px;border-radius:6px;">
        <input type="date" id="le-date-${p.id}-${li}" value="${l.date}" style="width:120px;flex-shrink:0;" />
        <textarea id="le-note-${p.id}-${li}" rows="2" style="flex:1;font-family:inherit;line-height:1.5;font-size:14px;padding:5px 9px;border-radius:6px;border:1px solid #ddd;background:#fff;">${l.note}</textarea>
        <div style="display:flex;flex-direction:column;gap:2px;">
          <button class="btn-icon ok" onclick="saveLog('${p._type}',${p.id},${li})" title="儲存" style="padding:2px 4px;font-size:16px;">✓</button>
          <button class="btn-icon" onclick="cancelLogEdit('${p._type}',${p.id},${li})" title="取消" style="padding:2px 4px;font-size:16px;">✕</button>
        </div>
      </div>`;
      }
      return `
      <div class="log-row">
        <span class="log-date">${fmtDate(l.date)||'—'}</span>
        <span class="log-text">${l.note}</span>
        <button class="log-del" onclick="editLog('${p._type}',${p.id},${li})" title="編輯" style="color:#aaa;">✎</button>
        <button class="log-del" onclick="deleteLog('${p._type}',${p.id},${li})" title="刪除">✕</button>
      </div>`;
    }).join('')
    :`<div style="font-size:13px;color:#bbb;margin-bottom:6px;">尚無進度記錄</div>`;

  const editHtml=p.editing?`
    <div class="card-edit">
      <div class="edit-grid">
        <div><label class="edit-label">名稱</label><input type="text" id="en-${p.id}" value="${p.name}" /></div>
        <div><label class="edit-label">指派日期</label><input type="date" id="ea-${p.id}" value="${p.arrived||''}" /></div>
        <div class="full"><label class="edit-label">說明／備註</label><textarea id="et-${p.id}" rows="3" style="resize:vertical;font-family:inherit;line-height:1.5;font-size:14px;padding:5px 9px;border-radius:6px;border:1px solid #ddd;background:#fafafa;color:#1a1a1a;width:100%;">${p.task}</textarea></div>
        <div><label class="edit-label">預計完成日期</label><input type="date" id="ed-${p.id}" value="${p.date}" /></div>
        <div><label class="edit-label">優先順序</label>
          <select id="ep-${p.id}">
            <option value="high" ${p.priority==='high'?'selected':''}>🔴 高</option>
            <option value="mid"  ${p.priority==='mid' ?'selected':''}>🟡 中</option>
            <option value="low"  ${p.priority==='low' ?'selected':''}>🟢 低</option>
          </select>
        </div>
        <div class="full" style="text-align:right;">
          <button class="btn-sm" onclick="saveItem('${p._type}',${p.id})" style="margin-right:6px;">儲存</button>
          <button class="btn-sm" onclick="cancelEdit('${p._type}',${p.id})">取消</button>
        </div>
      </div>
    </div>`:'';

  const calBtn = (!p.done && p.date) ? `<button class="btn-icon cal" onclick="addToGoogleCalendar('${p._type}',${p.id})" title="加入 Google 行事曆">📅</button>` : '';

  const actions=p.done
    ?`<button class="btn-icon undo" onclick="undoDone('${p._type}',${p.id})" title="取消完成">↩</button>
      <button class="btn-icon del"  onclick="deleteItem('${p._type}',${p.id})" title="刪除">🗑</button>`
    :`${calBtn}<button class="btn-complete" onclick="markDone('${p._type}',${p.id})">✓ 完成</button>
      <button class="btn-icon" onclick="editItem('${p._type}',${p.id})" title="編輯">✎</button>
      <button class="btn-icon del" onclick="deleteItem('${p._type}',${p.id})" title="刪除">🗑</button>`;

  const sortedReminders = (p.reminders||[])
    .map((r,originalIndex)=>({...r,originalIndex}))
    .sort((a,b)=>{
      if(!a.date && !b.date) return 0;
      if(!a.date) return 1;
      if(!b.date) return -1;
      return a.date.localeCompare(b.date);
    });

  const remindersHtml=sortedReminders.map((r)=>{
    const ri=r.originalIndex;
    if(r.editing){
      return `
      <div class="rem-row" style="background:#f0f4ff;padding:6px;border-radius:6px;">
        <input type="date" id="re-date-${p.id}-${ri}" value="${r.date}" style="width:120px;flex-shrink:0;" />
        <input type="text" id="re-note-${p.id}-${ri}" value="${r.note}" style="flex:1;" />
        <div style="display:flex;flex-direction:column;gap:2px;">
          <button class="btn-icon ok" onclick="saveReminder('${p._type}',${p.id},${ri})" title="儲存" style="padding:2px 4px;font-size:16px;">✓</button>
          <button class="btn-icon" onclick="cancelReminderEdit('${p._type}',${p.id},${ri})" title="取消" style="padding:2px 4px;font-size:16px;">✕</button>
        </div>
      </div>`;
    }
    return `
      <div class="rem-row">
        <input type="checkbox" class="rem-checkbox" ${r.done?'checked':''} onchange="toggleReminderDone('${p._type}',${p.id},${ri})" />
        <span class="rem-date">${fmtDate(r.date)||'—'}</span>
        <span class="rem-text ${r.done?'rem-done':''}">${r.note}</span>
        <button class="rem-icon cal" onclick="addReminderToGoogleCalendar('${p._type}',${p.id},${ri})" title="加入 Google 行事曆">📅</button>
        <button class="rem-icon" onclick="editReminder('${p._type}',${p.id},${ri})" title="編輯">✎</button>
        <button class="rem-icon del" onclick="deleteReminder('${p._type}',${p.id},${ri})" title="刪除">✕</button>
      </div>`;
  }).join('');

  const remindersSection=p.done?'':`
    <div class="reminders-area">
      <div class="reminders-label">待辦事項</div>
      ${remindersHtml}
      <div class="add-rem">
        <input type="date" id="rmd-${p.id}" value="${todayStr()}" />
        <input type="text" id="rmn-${p.id}" placeholder="輸入待辦內容…" />
        <button class="btn-sm" onclick="addReminder('${p._type}',${p.id})">新增</button>
      </div>
    </div>`;

  const logsSection=p.done?'':`
    <div class="logs-area">
      <div class="logs-label">進度記錄</div>
      ${logsHtml}
      <div class="add-log">
        <div class="add-log-row"><input type="date" id="ld-${p.id}" value="${todayStr()}" /></div>
        <div class="add-log-row">
          <textarea id="ln-${p.id}" placeholder="輸入進度內容…" rows="2"></textarea>
          <button class="btn-sm" onclick="addLog('${p._type}',${p.id})">新增</button>
        </div>
      </div>
    </div>`;

  return`
  <div class="project-card ${p.done?'is-done':''}" id="card-${p._type}-${p.id}">
    <div class="card-header">
      <div class="card-left">
        <div class="card-left-text">
          <div class="project-name ${p.done?'done-text':''}">${p.name}</div>
          ${(p.arrived||p.date)?`<div class="project-meta" style="color:#aaa;">${p.arrived?'指派日期：'+fmtDate(p.arrived):''}${p.arrived&&p.date?' ． ':''}${p.date?'預計完成日期：'+fmtDate(p.date):''}</div>`:''}
          ${p.task?`<div class="project-meta" style="white-space:pre-wrap;">專案說明：${p.task}</div>`:''}
        </div>
        ${badgeHtml(p)}
      </div>
      <div class="card-actions">${actions}</div>
    </div>
    ${editHtml}
    ${remindersSection}
    ${logsSection}
  </div>`;
}

function getList(type){return type==='repair'?repairs:projects;}

function addToGoogleCalendar(type,id){
  const p=getList(type).find(p=>p.id===id);
  if(!p||!p.date) return;
  const dateCompact=p.date.replace(/-/g,'');
  const title=encodeURIComponent(`【${type==='repair'?'維修':'專案'}】${p.name}`);
  const details=encodeURIComponent(p.task||'');
  const url=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dateCompact}/${dateCompact}&details=${details}`;
  window.open(url,'_blank');
}

function render(){
  const tag=t=>p=>({...p,_type:t});
  const pa=projects.filter(p=>!p.done).map(tag('project'));
  const pd=projects.filter(p=>p.done).map(tag('project'));
  const ra=repairs.filter(p=>!p.done).map(tag('repair'));
  const rd=repairs.filter(p=>p.done).map(tag('repair'));

  document.getElementById('active-list').innerHTML=pa.length?pa.map(cardHtml).join(''):'<div style="font-size:14px;color:#bbb;">目前沒有進行中的專案</div>';
  document.getElementById('repair-active-list').innerHTML=ra.length?ra.map(cardHtml).join(''):'<div style="font-size:14px;color:#bbb;">目前沒有進行中的工程</div>';

  const doneAll=[...pd,...rd];
  document.getElementById('done-list').innerHTML=pd.length?pd.map(cardHtml).join(''):'<div style="font-size:14px;color:#bbb;">尚無已完成的專案</div>';
  document.getElementById('repair-done-list').innerHTML=rd.length?rd.map(cardHtml).join(''):'<div style="font-size:14px;color:#bbb;">尚無已完成的工程</div>';

  document.getElementById('nav-count-project').textContent=pa.length;
  document.getElementById('nav-count-repair').textContent=ra.length;
  document.getElementById('nav-count-done').textContent=doneAll.length;

  renderSubNav('nav-sub-project', pa);
  renderSubNav('nav-sub-repair', ra);
  renderSubNav('nav-sub-done', doneAll);
}

function priorityDotColor(p){
  if(p.done) return '#0F6E56';
  return priorityColor(p.priority);
}

function renderSubNav(containerId, items){
  const el=document.getElementById(containerId);
  if(!el) return;
  el.innerHTML=items.map(p=>`
    <div class="nav-sub-item" onclick="jumpToCard('${p._type}',${p.id})" title="${p.name}">
      <span class="nav-sub-dot" style="background:${priorityDotColor(p)};"></span>${p.name}
    </div>`).join('');
}

function jumpToCard(type,id){
  const tabMap={project:'tab-project',repair:'tab-repair'};
  const card=document.getElementById(`card-${type}-${id}`);
  if(!card) return;

  // 若卡片在「已完成」清單裡，需切到已完成分頁
  const isDone=getList(type).find(p=>p.id===id)?.done;
  switchTab(isDone?'tab-done':tabMap[type]);

  setTimeout(()=>{
    const target=document.getElementById(`card-${type}-${id}`);
    if(!target) return;
    target.scrollIntoView({behavior:'smooth', block:'center'});
    target.classList.remove('card-highlight');
    void target.offsetWidth;
    target.classList.add('card-highlight');
  }, 50);
}

function switchTab(tabId){
  document.querySelectorAll('.tab-section').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  document.querySelector(`.nav-item[data-tab="${tabId}"]`).classList.add('active');
}

function toggleNavGroup(key){
  const sub=document.getElementById('nav-sub-'+key);
  const item=document.getElementById('nav-item-'+key);
  sub.classList.toggle('open');
  item.classList.toggle('open');
}

function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(saveToGitHub, 800);
}

function rerender(){ render(); renderCalendar(); scheduleSave(); }

let calViewYear, calViewMonth, selectedDate;
(function(){
  const now=new Date();
  calViewYear=now.getFullYear();
  calViewMonth=now.getMonth();
  selectedDate=todayStr();
})();

function priorityColor(p){
  if(p==='high') return '#A32D2D';
  if(p==='mid')  return '#854F0B';
  if(p==='low')  return '#3B6D11';
  return '#888';
}

function collectAllItems(){
  return [...projects.map(p=>({...p,_type:'project'})), ...repairs.map(p=>({...p,_type:'repair'}))];
}

function calPrevMonth(){
  calViewMonth--;
  if(calViewMonth<0){calViewMonth=11;calViewYear--;}
  renderCalendar();
}
function calNextMonth(){
  calViewMonth++;
  if(calViewMonth>11){calViewMonth=0;calViewYear++;}
  renderCalendar();
}

function renderCalendar(){
  const titleEl=document.getElementById('cal-title');
  const gridEl=document.getElementById('cal-grid');
  if(!titleEl||!gridEl) return;

  titleEl.textContent=`${calViewYear}年${calViewMonth+1}月`;

  const items=collectAllItems().filter(p=>!p.done);

  const eventsByDate={};
  items.forEach(p=>{
    if(p.arrived){
      (eventsByDate[p.arrived]=eventsByDate[p.arrived]||[]).push({type:'arrived',color:'#378ADD'});
    }
    if(p.date){
      (eventsByDate[p.date]=eventsByDate[p.date]||[]).push({type:'due',color:priorityColor(p.priority)});
    }
    (p.reminders||[]).forEach(r=>{
      if(r.date){
        (eventsByDate[r.date]=eventsByDate[r.date]||[]).push({type:'reminder',color:'#534AB7'});
      }
    });
  });

  const firstDay=new Date(calViewYear,calViewMonth,1);
  const startWeekday=firstDay.getDay();
  const daysInMonth=new Date(calViewYear,calViewMonth+1,0).getDate();
  const daysInPrevMonth=new Date(calViewYear,calViewMonth,0).getDate();

  const todayStr_=todayStr();

  let html='';
  ['日','一','二','三','四','五','六'].forEach(d=>html+=`<div class="dow">${d}</div>`);

  for(let i=0;i<startWeekday;i++){
    html+=`<div class="cal-day other-month">${daysInPrevMonth-startWeekday+1+i}</div>`;
  }

  for(let d=1;d<=daysInMonth;d++){
    const dateKey=`${calViewYear}-${String(calViewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=dateKey===todayStr_;
    let dotsHtml='';
    if(eventsByDate[dateKey]){
      dotsHtml=eventsByDate[dateKey].map(e=>`<div class="cal-dot" style="background:${e.color};"></div>`).join('');
    }
    const hasEvent=!!eventsByDate[dateKey];
    const isSelected=dateKey===selectedDate;
    const isHoliday=!!TW_HOLIDAYS_2026[dateKey];
    const dayOfWeek=(firstDay.getDay()+d-1)%7;
    const isWeekend=dayOfWeek===0||dayOfWeek===6;
    const classes=['cal-day'];
    if(isToday) classes.push('today');
    if(hasEvent) classes.push('has-event');
    if(isSelected) classes.push('selected');
    if(isHoliday) classes.push('holiday');
    else if(isWeekend) classes.push('weekend');
    const holidayDot=isHoliday?'<div class="cal-holiday-dot"></div>':'';
    html+=`<div class="${classes.join(' ')}" onclick="selectCalDate('${dateKey}')" title="${isHoliday?TW_HOLIDAYS_2026[dateKey]:''}">${d}${holidayDot}${dotsHtml}</div>`;
  }

  const totalCells=startWeekday+daysInMonth;
  const remain=(7-(totalCells%7))%7;
  for(let i=1;i<=remain;i++){
    html+=`<div class="cal-day other-month">${i}</div>`;
  }

  gridEl.innerHTML=html;
  renderDayList();
}

function selectCalDate(dateKey){
  selectedDate=dateKey;
  renderCalendar();
}

function renderDayList(){
  const titleEl=document.getElementById('today-title');
  const listEl=document.getElementById('today-list');
  if(!titleEl||!listEl) return;

  const t=selectedDate;
  const isToday=t===todayStr();
  const [y,m,d]=t.split('-').map(Number);
  const holidayName=TW_HOLIDAYS_2026[t]||'';
  titleEl.textContent=isToday?`${m}月${d}日 今日行程${holidayName?' · '+holidayName:''}`:`${m}月${d}日 行程${holidayName?' · '+holidayName:''}`;

  const items=collectAllItems().filter(p=>!p.done);
  const dayItems=[];

  items.forEach(p=>{
    if(p.arrived===t){
      dayItems.push({name:p.name,sub:'指派日期',color:'#378ADD'});
    }
    if(p.date===t){
      const labelMap={high:'高優先',mid:'中優先',low:'低優先'};
      dayItems.push({name:p.name,sub:`預計完成日期 · ${labelMap[p.priority]||''}`,color:priorityColor(p.priority)});
    }
    (p.reminders||[]).forEach(r=>{
      if(r.date===t){
        dayItems.push({name:p.name,sub:r.note,color:'#534AB7'});
      }
    });
  });

  if(!dayItems.length){
    listEl.innerHTML=`<div class="today-empty">${isToday?'今天':'這天'}沒有指派或預計完成的項目</div>`;
    return;
  }

  listEl.innerHTML=dayItems.map(it=>`
    <div class="today-item">
      <span class="dot" style="background:${it.color};"></span>
      <div>
        <p class="ti-name">${it.name}</p>
        <p class="ti-sub">${it.sub}</p>
      </div>
    </div>`).join('');
}

function markDone(type,id)  {getList(type).find(p=>p.id===id).done=true;    rerender();}
function undoDone(type,id)  {getList(type).find(p=>p.id===id).done=false;   rerender();}
function editItem(type,id)  {getList(type).find(p=>p.id===id).editing=true;  render();}
function cancelEdit(type,id){getList(type).find(p=>p.id===id).editing=false; render();}
function deleteItem(type,id){
  if(type==='repair') repairs=repairs.filter(p=>p.id!==id);
  else projects=projects.filter(p=>p.id!==id);
  rerender();
}

function saveItem(type,id){
  const p=getList(type).find(p=>p.id===id);
  p.name    =document.getElementById(`en-${id}`).value.trim()||p.name;
  p.arrived =document.getElementById(`ea-${id}`).value;
  p.task    =document.getElementById(`et-${id}`).value;
  p.date    =document.getElementById(`ed-${id}`).value;
  p.priority=document.getElementById(`ep-${id}`).value;
  p.editing=false;
  rerender();
}

function addLog(type,id){
  const p=getList(type).find(p=>p.id===id);
  const date=document.getElementById(`ld-${id}`).value;
  const note=document.getElementById(`ln-${id}`).value.trim();
  if(!note)return;
  p.logs.push({date,note});
  rerender();
}

function deleteLog(type,id,li){getList(type).find(p=>p.id===id).logs.splice(li,1);rerender();}

function addReminder(type,id){
  const p=getList(type).find(p=>p.id===id);
  const date=document.getElementById(`rmd-${id}`).value;
  const note=document.getElementById(`rmn-${id}`).value.trim();
  if(!note)return;
  if(!p.reminders) p.reminders=[];
  p.reminders.push({date,note});
  rerender();
}

function editReminder(type,id,ri){
  const p=getList(type).find(p=>p.id===id);
  p.reminders[ri].editing=true;
  render();
}

function cancelReminderEdit(type,id,ri){
  const p=getList(type).find(p=>p.id===id);
  p.reminders[ri].editing=false;
  render();
}

function saveReminder(type,id,ri){
  const p=getList(type).find(p=>p.id===id);
  p.reminders[ri].date=document.getElementById(`re-date-${id}-${ri}`).value;
  p.reminders[ri].note=document.getElementById(`re-note-${id}-${ri}`).value.trim();
  p.reminders[ri].editing=false;
  rerender();
}

function toggleReminderDone(type,id,ri){
  const p=getList(type).find(p=>p.id===id);
  p.reminders[ri].done = !p.reminders[ri].done;
  rerender();
}

function deleteReminder(type,id,ri){
  getList(type).find(p=>p.id===id).reminders.splice(ri,1);
  rerender();
}

function addReminderToGoogleCalendar(type,id,ri){
  const p=getList(type).find(p=>p.id===id);
  const r=p.reminders[ri];
  if(!r||!r.date) return;
  const dateCompact=r.date.replace(/-/g,'');
  const title=encodeURIComponent(`【${p.name}】${r.note}`);
  const url=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dateCompact}/${dateCompact}`;
  window.open(url,'_blank');
}

function editLog(type,id,li){
  getList(type).find(p=>p.id===id).logs[li].editing=true;
  render();
}

function cancelLogEdit(type,id,li){
  getList(type).find(p=>p.id===id).logs[li].editing=false;
  render();
}

function saveLog(type,id,li){
  const p=getList(type).find(p=>p.id===id);
  p.logs[li].date=document.getElementById(`le-date-${id}-${li}`).value;
  p.logs[li].note=document.getElementById(`le-note-${id}-${li}`).value.trim();
  p.logs[li].editing=false;
  rerender();
}

let selectedBrand = { project: '', repair: '' };

function selectBrand(type, brand){
  selectedBrand[type] = brand;
  const row = document.getElementById('brand-row-' + type);
  row.querySelectorAll('.brand-btn').forEach(btn => {
    btn.classList.remove('selected');
    if(btn.textContent === (brand || '不選（自填）')) btn.classList.add('selected');
  });
}

function addItem(type){
  if(type==='repair'){
    const name=document.getElementById('rn').value.trim();
    if(!name)return;
    const repairBrandPrefix = selectedBrand['repair'] ? selectedBrand['repair'] + ' - ' : '';
    const finalRepairName = repairBrandPrefix + name;
    repairs.push({id:nextId++,name:finalRepairName,arrived:document.getElementById('ra').value,task:document.getElementById('rt').value,date:document.getElementById('rd').value,priority:document.getElementById('rp').value,done:false,editing:false,logs:[]});
    ['rn','ra','rt','rd'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('rp').value='mid';
    selectBrand('repair','');
  } else {
    const name=document.getElementById('an').value.trim();
    if(!name)return;
    const brandPrefix = selectedBrand['project'] ? selectedBrand['project'] + ' - ' : '';
    const finalName = brandPrefix + name;
    projects.push({id:nextId++,name:finalName,arrived:document.getElementById('aa').value,task:document.getElementById('at').value,date:document.getElementById('ad').value,priority:document.getElementById('ap').value,done:false,editing:false,logs:[]});
    ['an','aa','at','ad'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('ap').value='mid';
    selectBrand('project','');
  }
  rerender();
}

function exportReport(){
  const now=new Date();
  let text=`📋 工作週報｜${now.getFullYear()} ${now.getMonth()+1}/${now.getDate()}\n\n`;
  const active=projects.filter(p=>!p.done);
  const done=projects.filter(p=>p.done);
  if(active.length){
    text+=`【進行中的專案】\n`;
    active.forEach(p=>{
      text+=`- ${p.name}${p.arrived?'（指派 '+fmtDate(p.arrived)+'）':''}｜${p.task}${p.date?'（預計完成 '+fmtDate(p.date)+'）':''}\n`;
      (p.reminders||[]).forEach(r=>text+=`  待辦 ${fmtDate(r.date)||'　'}　${r.note}\n`);
      p.logs.slice(-3).forEach(l=>text+=`  ${fmtDate(l.date)||'　'}　${l.note}\n`);
    });
  }
  if(done.length){
    text+=`\n【專案已完成】\n`;
    done.forEach(p=>text+=`- ${p.name}｜${p.task}\n`);
  }
  const ra=repairs.filter(p=>!p.done);
  const rd=repairs.filter(p=>p.done);
  if(ra.length){
    text+=`\n【維修及零星工程 - 進行中】\n`;
    ra.forEach(p=>{
      text+=`- ${p.name}${p.arrived?'（指派 '+fmtDate(p.arrived)+'）':''}｜${p.task}${p.date?'（預計完成 '+fmtDate(p.date)+'）':''}\n`;
      (p.reminders||[]).forEach(r=>text+=`  待辦 ${fmtDate(r.date)||'　'}　${r.note}\n`);
      p.logs.slice(-3).forEach(l=>text+=`  ${fmtDate(l.date)||'　'}　${l.note}\n`);
    });
  }
  if(rd.length){
    text+=`\n【維修及零星工程 - 已完成】\n`;
    rd.forEach(p=>text+=`- ${p.name}｜${p.task}\n`);
  }
  text+=`\n請幫我整理上述專案與維修工程，標注優先順序並列出下週需要推進的行動項目。`;
  const box=document.getElementById('export-box');
  box.textContent=text;
  box.style.display='block';
  navigator.clipboard?.writeText(text).then(()=>{
    const el=document.getElementById('copied');
    el.style.display='inline';
    setTimeout(()=>el.style.display='none',2000);
  });
}

// ===== GitHub Sync =====

async function loadFromGitHub(){
  const token=getToken();
  if(!token){ showTokenModal(); setStatus('','請設定 Token'); return; }
  setStatus('busy','讀取中…');
  try{
    const res=await fetch(GH_API+'?ref=main', {
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github+json'}
    });
    if(res.status===404){
      // 檔案不存在，建立初始資料
      projects=[
        {id:1,name:"忠孝SOGO",arrived:"",task:"局部修改設計圖 → 圖審送件",date:"",priority:"high",done:false,editing:false,logs:[]},
        {id:2,name:"漢神巨蛋",arrived:"",task:"三方案設計圖面",date:"",priority:"mid",done:false,editing:false,logs:[]},
        {id:3,name:"台北辦公室",arrived:"",task:"會議室修改",date:"",priority:"low",done:false,editing:false,logs:[]},
      ];
      repairs=[];
      nextId=10;
      render();
      renderCalendar();
      await saveToGitHub();
      return;
    }
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    fileSha=data.sha;
    const content=JSON.parse(decodeURIComponent(escape(atob(data.content))));
    projects=(content.projects||[]).map(p=>({...p,editing:false}));
    repairs=(content.repairs||[]).map(p=>({...p,editing:false}));
    nextId=content.nextId||1;
    render();
    renderCalendar();
    setStatus('ok','已同步');
  }catch(e){
    console.error(e);
    setStatus('err','讀取失敗：'+e.message);
  }
}

async function saveToGitHub(){
  const token=getToken();
  if(!token) return;
  setStatus('busy','儲存中…');
  try{
    const payload={projects,repairs,nextId};
    const jsonStr=JSON.stringify(payload, null, 2);
    const b64=btoa(unescape(encodeURIComponent(jsonStr)));
    const body={
      message:'更新資料 '+new Date().toISOString(),
      content:b64,
      branch:'main'
    };
    if(fileSha) body.sha=fileSha;
    const res=await fetch(GH_API,{
      method:'PUT',
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    if(!res.ok){
      const err=await res.json();
      throw new Error(err.message||('HTTP '+res.status));
    }
    const data=await res.json();
    fileSha=data.content.sha;
    setStatus('ok','已同步 · '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    console.error(e);
    setStatus('err','儲存失敗：'+e.message);
  }
}

function manualSync(){ loadFromGitHub(); }

function showHistoryModal(){
  document.getElementById('history-modal').style.display='flex';
  loadHistory();
}
function hideHistoryModal(){
  document.getElementById('history-modal').style.display='none';
}

async function loadHistory(){
  const listEl=document.getElementById('history-list');
  listEl.innerHTML='<div class="history-loading">讀取歷史紀錄中…</div>';
  const token=getToken();
  try{
    const res=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/commits?path=${GH_PATH}&per_page=15`,{
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github+json'}
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const commits=await res.json();
    if(!commits.length){
      listEl.innerHTML='<div class="history-loading">沒有歷史紀錄</div>';
      return;
    }
    listEl.innerHTML=commits.map((c,i)=>{
      const d=new Date(c.commit.author.date);
      const timeStr=`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      const label = i===0 ? '（目前版本）' : '';
      return `
        <div class="history-item">
          <span class="h-time">${timeStr} ${label}</span>
          ${i===0 ? '' : `<button class="h-restore" onclick="restoreVersion('${c.sha}')">還原這個版本</button>`}
        </div>`;
    }).join('');
  }catch(e){
    listEl.innerHTML='<div class="history-loading">讀取失敗：'+e.message+'</div>';
  }
}

async function restoreVersion(commitSha){
  if(!confirm('確定要還原到這個版本嗎？目前的內容會被覆蓋（但仍會留在歷史紀錄裡）。')) return;
  const token=getToken();
  try{
    const res=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}?ref=${commitSha}`,{
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github+json'}
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    const content=JSON.parse(decodeURIComponent(escape(atob(data.content))));
    projects=(content.projects||[]).map(p=>({...p,editing:false}));
    repairs=(content.repairs||[]).map(p=>({...p,editing:false}));
    nextId=content.nextId||1;
    render();
    renderCalendar();
    hideHistoryModal();
    await saveToGitHub();
  }catch(e){
    alert('還原失敗：'+e.message);
  }
}

getWeekRange();
if(!getToken()){
  showTokenModal();
} else {
  loadFromGitHub();
}
