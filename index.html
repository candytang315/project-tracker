<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>專案週報</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f3; padding: 1.5rem; color: #1a1a1a; }
.wrap { max-width: 720px; margin: 0 auto; }
.page-title { font-size: 18px; font-weight: 500; margin-bottom: 4px; }
.week-label { font-size: 13px; color: #666; margin-bottom: 1.5rem; }
.sec-title { font-size: 13px; font-weight: 500; color: #555; margin-bottom: 10px; }
.done-sec-title { font-size: 13px; font-weight: 500; color: #999; margin: 1.2rem 0 8px; }
.project-card { background: #fff; border: 1px solid #e5e5e3; border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
.project-card.is-done { opacity: 0.65; }
.card-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; gap: 8px; }
.card-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.card-left-text { min-width: 0; flex: 1; }
.project-name { font-size: 14px; font-weight: 500; }
.project-name.done-text { text-decoration: line-through; color: #aaa; }
.project-meta { font-size: 12px; color: #888; margin-top: 2px; }
.badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
.badge-high { background: #FCEBEB; color: #A32D2D; }
.badge-mid  { background: #FAEEDA; color: #854F0B; }
.badge-low  { background: #EAF3DE; color: #3B6D11; }
.badge-done { background: #E1F5EE; color: #0F6E56; }
.card-actions { display: flex; gap: 4px; flex-shrink: 0; align-items: center; }
.btn-icon { background: none; border: none; cursor: pointer; padding: 5px 6px; border-radius: 6px; color: #888; font-size: 18px; display: inline-flex; align-items: center; }
.btn-icon:hover { background: #f0f0ee; color: #333; }
.btn-icon.del:hover  { color: #A32D2D; background: #FCEBEB; }
.btn-icon.undo:hover { color: #854F0B; background: #FAEEDA; }
.btn-icon.ok:hover   { color: #0F6E56; background: #E1F5EE; }
.btn-complete { font-size: 12px; padding: 5px 12px; border-radius: 6px; border: 1px solid #9FE1CB; background: #E1F5EE; color: #0F6E56; cursor: pointer; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.btn-complete:hover { background: #9FE1CB; }
.card-edit { padding: 0 14px 14px; border-top: 1px solid #eee; }
.edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-top: 12px; }
.edit-grid .full { grid-column: 1 / -1; }
.edit-label { font-size: 11px; color: #999; display: block; margin-bottom: 3px; }
select, input[type="text"], input[type="date"] { font-size: 13px; padding: 5px 9px; border-radius: 6px; border: 1px solid #ddd; background: #fafafa; color: #1a1a1a; width: 100%; }
.logs-area { border-top: 1px solid #eee; padding: 10px 14px 14px; background: #fafafa; }
.logs-label { font-size: 11px; color: #999; margin-bottom: 8px; }
.log-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; }
.log-date { font-size: 11px; color: #999; white-space: nowrap; padding-top: 3px; width: 40px; flex-shrink: 0; }
.log-text { font-size: 13px; color: #333; line-height: 1.5; flex: 1; word-break: break-word; white-space: pre-wrap; }
.log-del { background: none; border: none; cursor: pointer; color: #ccc; font-size: 16px; padding: 1px 3px; flex-shrink: 0; }
.log-del:hover { color: #A32D2D; }
.add-log { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.add-log-row { display: flex; gap: 6px; align-items: center; }
.add-log-row textarea { flex: 1; resize: vertical; font-family: inherit; line-height: 1.5; font-size: 13px; padding: 5px 9px; border-radius: 6px; border: 1px solid #ddd; background: #fafafa; color: #1a1a1a; }
.btn-sm { font-size: 12px; padding: 5px 14px; border-radius: 6px; border: 1px solid #ddd; background: #fff; color: #333; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.btn-sm:hover { background: #f0f0ee; }
.add-card { border: 1px dashed #ccc; border-radius: 12px; padding: 14px; margin-bottom: 10px; background: #fff; }
.add-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.add-grid .full { grid-column: 1 / -1; text-align: right; }
.divider { border: none; border-top: 1px solid #e5e5e3; margin: 1.5rem 0; }
.btn-export { font-size: 13px; padding: 8px 18px; border-radius: 6px; border: 1px solid #ddd; background: #fff; color: #333; cursor: pointer; }
.btn-export:hover { background: #f0f0ee; }
.copied { font-size: 12px; color: #0F6E56; margin-left: 10px; display: none; }
.export-box { margin-top: 1rem; background: #fafafa; border: 1px solid #e5e5e3; border-radius: 8px; padding: 1rem; font-size: 13px; white-space: pre-wrap; line-height: 1.7; display: none; }
.sync-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 1.2rem; padding: 10px 14px; background: #fff; border: 1px solid #e5e5e3; border-radius: 10px; font-size: 12px; color: #888; }
.sync-bar .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
.sync-bar .status-dot.ok { background: #3B6D11; }
.sync-bar .status-dot.err { background: #A32D2D; }
.sync-bar .status-dot.busy { background: #854F0B; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
.sync-bar .spacer { flex: 1; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal-box { background: #fff; border-radius: 12px; padding: 1.5rem; max-width: 360px; width: 90%; }
.modal-box h3 { font-size: 15px; margin-bottom: 10px; }
.modal-box p { font-size: 13px; color: #666; margin-bottom: 12px; line-height: 1.6; }
.modal-box input { margin-bottom: 10px; }
</style>
</head>
<body>

<div id="token-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h3>🔑 設定 GitHub Token</h3>
    <p>請輸入你的 GitHub Personal Access Token，用來讀寫資料。只會存在這台裝置的瀏覽器裡。</p>
    <input type="text" id="token-input" placeholder="ghp_xxxxxxxxxxxxxxxx" />
    <button class="btn-sm" onclick="saveToken()" style="width:100%;">儲存並開始使用</button>
  </div>
</div>

<div class="wrap">
  <h1 class="page-title">專案週報</h1>
  <p class="week-label" id="week-range"></p>

  <div class="sync-bar">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">準備中…</span>
    <span class="spacer"></span>
    <button class="btn-sm" onclick="manualSync()">🔄 同步</button>
    <button class="btn-sm" onclick="showTokenModal()">⚙️</button>
  </div>

  <div class="sec-title">進行中的專案</div>
  <div id="active-list"></div>
  <div id="done-section" style="display:none;">
    <div class="done-sec-title">已完成</div>
    <div id="done-list"></div>
  </div>
  <div class="add-card">
    <div class="sec-title" style="margin-bottom:10px;">新增專案</div>
    <div class="add-grid">
      <div><label class="edit-label">專案名稱</label><input type="text" id="an" placeholder="例：忠孝SOGO" /></div>
      <div><label class="edit-label">指派日期</label><input type="date" id="aa" /></div>
      <div><label class="edit-label">專案說明／備註</label><input type="text" id="at" placeholder="例：局部修改後送百貨圖審" /></div>
      <div><label class="edit-label">預計完成日期</label><input type="date" id="ad" /></div>
      <div><label class="edit-label">優先順序</label>
        <select id="ap"><option value="high">🔴 高</option><option value="mid" selected>🟡 中</option><option value="low">🟢 低</option></select>
      </div>
      <div class="full"><button class="btn-sm" onclick="addItem('project')">＋ 新增</button></div>
    </div>
  </div>

  <hr class="divider">

  <div class="sec-title">維修及零星工程</div>
  <div id="repair-active-list"></div>
  <div id="repair-done-section" style="display:none;">
    <div class="done-sec-title">已完成</div>
    <div id="repair-done-list"></div>
  </div>
  <div class="add-card">
    <div class="sec-title" style="margin-bottom:10px;">新增維修及零星工程</div>
    <div class="add-grid">
      <div><label class="edit-label">工程名稱</label><input type="text" id="rn" placeholder="例：漢神巨蛋燈具維修" /></div>
      <div><label class="edit-label">指派日期</label><input type="date" id="ra" /></div>
      <div><label class="edit-label">工程內容／備註</label><input type="text" id="rt" placeholder="例：燈具損壞需更換" /></div>
      <div><label class="edit-label">預計完成日期</label><input type="date" id="rd" /></div>
      <div><label class="edit-label">優先順序</label>
        <select id="rp"><option value="high">🔴 高</option><option value="mid" selected>🟡 中</option><option value="low">🟢 低</option></select>
      </div>
      <div class="full"><button class="btn-sm" onclick="addItem('repair')">＋ 新增</button></div>
    </div>
  </div>

  <hr class="divider">
  <button class="btn-export" onclick="exportReport()">複製週報給 Claude 整理</button>
  <span class="copied" id="copied">已複製 ✓</span>
  <div class="export-box" id="export-box"></div>
</div>

<script>
const GH_OWNER='candytang315';
const GH_REPO='project-tracker';
const GH_PATH='data.json';
const GH_API=`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`;

let projects=[];
let repairs=[];
let nextId=1;
let fileSha=null;
let saveTimer=null;

function getToken(){ return localStorage.getItem('gh_token')||''; }

function showTokenModal(){ document.getElementById('token-modal').style.display='flex'; }
function hideTokenModal(){ document.getElementById('token-modal').style.display='none'; }

function saveToken(){
  const t=document.getElementById('token-input').value.trim();
  if(!t) return;
  localStorage.setItem('gh_token', t);
  hideTokenModal();
  loadFromGitHub();
}

function setStatus(state, text){
  const dot=document.getElementById('status-dot');
  dot.className='status-dot '+(state||'');
  document.getElementById('status-text').textContent=text;
}

function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

function getWeekRange(){
  const now=new Date(), day=now.getDay();
  const mon=new Date(now); mon.setDate(now.getDate()-(day===0?6:day-1));
  const fri=new Date(mon); fri.setDate(mon.getDate()+4);
  const fmt=d=>`${d.getMonth()+1}/${d.getDate()}`;
  const wn=Math.ceil((((now-new Date(now.getFullYear(),0,1))/86400000)+new Date(now.getFullYear(),0,1).getDay()+1)/7);
  document.getElementById('week-range').textContent=`${now.getFullYear()} 第${wn}週｜${fmt(mon)} – ${fmt(fri)}`;
}

function badgeHtml(p){
  if(p.done)return`<span class="badge badge-done">✅ 完成</span>`;
  const m={high:['badge-high','🔴 高'],mid:['badge-mid','🟡 中'],low:['badge-low','🟢 低']};
  const[c,l]=m[p.priority]||m.mid;return`<span class="badge ${c}">${l}</span>`;
}

function fmtDate(s){if(!s)return'';const[,m,d]=s.split('-');return`${parseInt(m)}/${parseInt(d)}`;}

function cardHtml(p){
  const logsHtml=p.logs.length
    ?p.logs.map((l,li)=>{
      if(l.editing){
        return `
      <div class="log-row" style="background:#f0f4ff;padding:6px;border-radius:6px;">
        <input type="date" id="le-date-${p.id}-${li}" value="${l.date}" style="width:120px;flex-shrink:0;" />
        <textarea id="le-note-${p.id}-${li}" rows="2" style="flex:1;font-family:inherit;line-height:1.5;font-size:13px;padding:5px 9px;border-radius:6px;border:1px solid #ddd;background:#fff;">${l.note}</textarea>
        <div style="display:flex;flex-direction:column;gap:2px;">
          <button class="btn-icon ok" onclick="saveLog('${p._type}',${p.id},${li})" title="儲存" style="padding:2px 4px;font-size:15px;">✓</button>
          <button class="btn-icon" onclick="cancelLogEdit('${p._type}',${p.id},${li})" title="取消" style="padding:2px 4px;font-size:15px;">✕</button>
        </div>
      </div>`;
      }
      return `
      <div class="log-row">
        <span class="log-date">${fmtDate(l.date)||'—'}</span>
        <span class="log-text">${l.note}</span>
        <button class="log-del" onclick="editLog('${p._type}',${p.id},${li})" title="編輯" style="color:#aaa;">✎</button>
        <button class="log-del" onclick="deleteLog('${p._type}',${p.id},${li})" title="刪除">✕</button>
      </div>`;
    }).join('')
    :`<div style="font-size:13px;color:#bbb;margin-bottom:6px;">尚無進度記錄</div>`;

  const editHtml=p.editing?`
    <div class="card-edit">
      <div class="edit-grid">
        <div><label class="edit-label">名稱</label><input type="text" id="en-${p.id}" value="${p.name}" /></div>
        <div><label class="edit-label">指派日期</label><input type="date" id="ea-${p.id}" value="${p.arrived||''}" /></div>
        <div><label class="edit-label">說明／備註</label><input type="text" id="et-${p.id}" value="${p.task}" /></div>
        <div><label class="edit-label">預計完成日期</label><input type="date" id="ed-${p.id}" value="${p.date}" /></div>
        <div><label class="edit-label">優先順序</label>
          <select id="ep-${p.id}">
            <option value="high" ${p.priority==='high'?'selected':''}>🔴 高</option>
            <option value="mid"  ${p.priority==='mid' ?'selected':''}>🟡 中</option>
            <option value="low"  ${p.priority==='low' ?'selected':''}>🟢 低</option>
          </select>
        </div>
        <div class="full" style="text-align:right;">
          <button class="btn-sm" onclick="saveItem('${p._type}',${p.id})" style="margin-right:6px;">儲存</button>
          <button class="btn-sm" onclick="cancelEdit('${p._type}',${p.id})">取消</button>
        </div>
      </div>
    </div>`:'';

  const actions=p.done
    ?`<button class="btn-icon undo" onclick="undoDone('${p._type}',${p.id})" title="取消完成">↩</button>
      <button class="btn-icon del"  onclick="deleteItem('${p._type}',${p.id})" title="刪除">🗑</button>`
    :`<button class="btn-complete" onclick="markDone('${p._type}',${p.id})">✓ 完成</button>
      <button class="btn-icon" onclick="editItem('${p._type}',${p.id})" title="編輯">✎</button>
      <button class="btn-icon del" onclick="deleteItem('${p._type}',${p.id})" title="刪除">🗑</button>`;

  const logsSection=p.done?'':`
    <div class="logs-area">
      <div class="logs-label">進度記錄</div>
      ${logsHtml}
      <div class="add-log">
        <div class="add-log-row"><input type="date" id="ld-${p.id}" value="${todayStr()}" /></div>
        <div class="add-log-row">
          <textarea id="ln-${p.id}" placeholder="輸入進度內容…" rows="2"></textarea>
          <button class="btn-sm" onclick="addLog('${p._type}',${p.id})">新增</button>
        </div>
      </div>
    </div>`;

  return`
  <div class="project-card ${p.done?'is-done':''}">
    <div class="card-header">
      <div class="card-left">
        <div class="card-left-text">
          <div class="project-name ${p.done?'done-text':''}">${p.name}</div>
          ${(p.arrived||p.date)?`<div class="project-meta" style="color:#aaa;">${p.arrived?'指派日期：'+fmtDate(p.arrived):''}${p.arrived&&p.date?' ． ':''}${p.date?'預計完成日期：'+fmtDate(p.date):''}</div>`:''}
          ${p.task?`<div class="project-meta">專案說明：${p.task}</div>`:''}
        </div>
        ${badgeHtml(p)}
      </div>
      <div class="card-actions">${actions}</div>
    </div>
    ${editHtml}
    ${logsSection}
  </div>`;
}

function getList(type){return type==='repair'?repairs:projects;}

function render(){
  const tag=t=>p=>({...p,_type:t});
  const pa=projects.filter(p=>!p.done).map(tag('project'));
  const pd=projects.filter(p=>p.done).map(tag('project'));
  const ra=repairs.filter(p=>!p.done).map(tag('repair'));
  const rd=repairs.filter(p=>p.done).map(tag('repair'));
  document.getElementById('active-list').innerHTML=pa.map(cardHtml).join('');
  document.getElementById('done-list').innerHTML=pd.map(cardHtml).join('');
  document.getElementById('done-section').style.display=pd.length?'block':'none';
  document.getElementById('repair-active-list').innerHTML=ra.map(cardHtml).join('');
  document.getElementById('repair-done-list').innerHTML=rd.map(cardHtml).join('');
  document.getElementById('repair-done-section').style.display=rd.length?'block':'none';
}

function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(saveToGitHub, 800);
}

function rerender(){ render(); scheduleSave(); }

function markDone(type,id)  {getList(type).find(p=>p.id===id).done=true;    rerender();}
function undoDone(type,id)  {getList(type).find(p=>p.id===id).done=false;   rerender();}
function editItem(type,id)  {getList(type).find(p=>p.id===id).editing=true;  render();}
function cancelEdit(type,id){getList(type).find(p=>p.id===id).editing=false; render();}
function deleteItem(type,id){
  if(type==='repair') repairs=repairs.filter(p=>p.id!==id);
  else projects=projects.filter(p=>p.id!==id);
  rerender();
}

function saveItem(type,id){
  const p=getList(type).find(p=>p.id===id);
  p.name    =document.getElementById(`en-${id}`).value.trim()||p.name;
  p.arrived =document.getElementById(`ea-${id}`).value;
  p.task    =document.getElementById(`et-${id}`).value;
  p.date    =document.getElementById(`ed-${id}`).value;
  p.priority=document.getElementById(`ep-${id}`).value;
  p.editing=false;
  rerender();
}

function addLog(type,id){
  const p=getList(type).find(p=>p.id===id);
  const date=document.getElementById(`ld-${id}`).value;
  const note=document.getElementById(`ln-${id}`).value.trim();
  if(!note)return;
  p.logs.push({date,note});
  rerender();
}

function deleteLog(type,id,li){getList(type).find(p=>p.id===id).logs.splice(li,1);rerender();}

function editLog(type,id,li){
  getList(type).find(p=>p.id===id).logs[li].editing=true;
  render();
}

function cancelLogEdit(type,id,li){
  getList(type).find(p=>p.id===id).logs[li].editing=false;
  render();
}

function saveLog(type,id,li){
  const p=getList(type).find(p=>p.id===id);
  p.logs[li].date=document.getElementById(`le-date-${id}-${li}`).value;
  p.logs[li].note=document.getElementById(`le-note-${id}-${li}`).value.trim();
  p.logs[li].editing=false;
  rerender();
}

function addItem(type){
  if(type==='repair'){
    const name=document.getElementById('rn').value.trim();
    if(!name)return;
    repairs.push({id:nextId++,name,arrived:document.getElementById('ra').value,task:document.getElementById('rt').value,date:document.getElementById('rd').value,priority:document.getElementById('rp').value,done:false,editing:false,logs:[]});
    ['rn','ra','rt','rd'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('rp').value='mid';
  } else {
    const name=document.getElementById('an').value.trim();
    if(!name)return;
    projects.push({id:nextId++,name,arrived:document.getElementById('aa').value,task:document.getElementById('at').value,date:document.getElementById('ad').value,priority:document.getElementById('ap').value,done:false,editing:false,logs:[]});
    ['an','aa','at','ad'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('ap').value='mid';
  }
  rerender();
}

function exportReport(){
  const now=new Date();
  let text=`📋 工作週報｜${now.getFullYear()} ${now.getMonth()+1}/${now.getDate()}\n\n`;
  const active=projects.filter(p=>!p.done);
  const done=projects.filter(p=>p.done);
  if(active.length){
    text+=`【進行中的專案】\n`;
    active.forEach(p=>{
      text+=`- ${p.name}${p.arrived?'（指派 '+fmtDate(p.arrived)+'）':''}｜${p.task}${p.date?'（預計完成 '+fmtDate(p.date)+'）':''}\n`;
      p.logs.slice(-3).forEach(l=>text+=`  ${fmtDate(l.date)||'　'}　${l.note}\n`);
    });
  }
  if(done.length){
    text+=`\n【專案已完成】\n`;
    done.forEach(p=>text+=`- ${p.name}｜${p.task}\n`);
  }
  const ra=repairs.filter(p=>!p.done);
  const rd=repairs.filter(p=>p.done);
  if(ra.length){
    text+=`\n【維修及零星工程 - 進行中】\n`;
    ra.forEach(p=>{
      text+=`- ${p.name}${p.arrived?'（指派 '+fmtDate(p.arrived)+'）':''}｜${p.task}${p.date?'（預計完成 '+fmtDate(p.date)+'）':''}\n`;
      p.logs.slice(-3).forEach(l=>text+=`  ${fmtDate(l.date)||'　'}　${l.note}\n`);
    });
  }
  if(rd.length){
    text+=`\n【維修及零星工程 - 已完成】\n`;
    rd.forEach(p=>text+=`- ${p.name}｜${p.task}\n`);
  }
  text+=`\n請幫我整理上述專案與維修工程，標注優先順序並列出下週需要推進的行動項目。`;
  const box=document.getElementById('export-box');
  box.textContent=text;
  box.style.display='block';
  navigator.clipboard?.writeText(text).then(()=>{
    const el=document.getElementById('copied');
    el.style.display='inline';
    setTimeout(()=>el.style.display='none',2000);
  });
}

// ===== GitHub Sync =====

async function loadFromGitHub(){
  const token=getToken();
  if(!token){ showTokenModal(); setStatus('','請設定 Token'); return; }
  setStatus('busy','讀取中…');
  try{
    const res=await fetch(GH_API+'?ref=main', {
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github+json'}
    });
    if(res.status===404){
      // 檔案不存在，建立初始資料
      projects=[
        {id:1,name:"忠孝SOGO",arrived:"",task:"局部修改設計圖 → 圖審送件",date:"",priority:"high",done:false,editing:false,logs:[]},
        {id:2,name:"漢神巨蛋",arrived:"",task:"三方案設計圖面",date:"",priority:"mid",done:false,editing:false,logs:[]},
        {id:3,name:"台北辦公室",arrived:"",task:"會議室修改",date:"",priority:"low",done:false,editing:false,logs:[]},
      ];
      repairs=[];
      nextId=10;
      render();
      await saveToGitHub();
      return;
    }
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    fileSha=data.sha;
    const content=JSON.parse(decodeURIComponent(escape(atob(data.content))));
    projects=(content.projects||[]).map(p=>({...p,editing:false}));
    repairs=(content.repairs||[]).map(p=>({...p,editing:false}));
    nextId=content.nextId||1;
    render();
    setStatus('ok','已同步');
  }catch(e){
    console.error(e);
    setStatus('err','讀取失敗：'+e.message);
  }
}

async function saveToGitHub(){
  const token=getToken();
  if(!token) return;
  setStatus('busy','儲存中…');
  try{
    const payload={projects,repairs,nextId};
    const jsonStr=JSON.stringify(payload, null, 2);
    const b64=btoa(unescape(encodeURIComponent(jsonStr)));
    const body={
      message:'更新資料 '+new Date().toISOString(),
      content:b64,
      branch:'main'
    };
    if(fileSha) body.sha=fileSha;
    const res=await fetch(GH_API,{
      method:'PUT',
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    if(!res.ok){
      const err=await res.json();
      throw new Error(err.message||('HTTP '+res.status));
    }
    const data=await res.json();
    fileSha=data.content.sha;
    setStatus('ok','已同步 · '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    console.error(e);
    setStatus('err','儲存失敗：'+e.message);
  }
}

function manualSync(){ loadFromGitHub(); }

// ===== Init =====
getWeekRange();
if(!getToken()){
  showTokenModal();
} else {
  loadFromGitHub();
}
